server {
    listen 80;
    root /usr/share/nginx/html;

    # Não expõe a versão do nginx nas respostas/páginas de erro
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança (always = também em respostas de erro)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Arquivos do build têm hash no nome: podem ficar em cache por muito tempo.
    # Se um arquivo não existir (ex.: navegador com index.html antigo após um deploy), responde 404
    # em vez de devolver o index.html no lugar do JavaScript (o que deixaria a tela em branco).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # index.html e a configuração de runtime nunca ficam em cache: cada deploy é carregado na hora
    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        index index.html index.htm;
        # Impede erro 404 ao atualizar rotas do React (SPA fallback)
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
